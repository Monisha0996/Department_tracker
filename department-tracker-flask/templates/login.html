{% extends "base.html" %}

{% block content %}
<style>
  .login-wrapper {
    min-height: 75vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f6f6f8;
    border-radius: 18px;
    padding: 40px 20px;
  }

  .login-card {
    width: 100%;
    max-width: 420px;
    background: #fcfcfc;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    box-shadow: 0 12px 35px rgba(15, 23, 42, 0.08);
    padding: 32px;
  }

  .login-logo {
    width: 72px;
    height: 72px;
    border-radius: 12px;
    background: #c52126;
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 20px;
    margin-bottom: 18px;
  }

  .login-title {
    font-weight: 700;
    margin-bottom: 6px;
    color: #111827;
  }

  .login-subtitle {
    color: #6b7280;
    font-size: 14px;
    margin-bottom: 26px;
  }

  .form-label {
    font-weight: 600;
    font-size: 14px;
    color: #374151;
  }

  .form-control {
    height: 46px;
    border-radius: 10px;
  }

  .login-btn {
    height: 46px;
    border-radius: 10px;
    font-weight: 600;
  }

  .security-note {
    font-size: 12px;
    color: #6b7280;
    text-align: center;
    margin-top: 18px;
  }
</style>

<div class="login-wrapper">
  <div class="login-card">

    <div class="login-logo">
      W C
    </div>

    <h3 class="login-title">Department Work Tracker</h3>
    <p class="login-subtitle">
      Secure access for authorised department users.
    </p>

    <form method="post">
      <div class="mb-3">
        <label class="form-label">Email address</label>
        <input 
          type="email" 
          name="email" 
          class="form-control" 
          placeholder="Enter your email"
          required
        >
      </div>

      <div class="mb-4">
        <label class="form-label">Password</label>
        <input 
          type="password" 
          name="password" 
          class="form-control" 
          placeholder="Enter your password"
          required
        >
      </div>

      <button class="btn btn-primary w-100 login-btn">
        Login
      </button>
    </form>

    <div class="security-note">
      Access is monitored and restricted to authorised users only.
    </div>

  </div>
</div>
{% endblock %}
