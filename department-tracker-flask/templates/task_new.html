{% extends "base.html" %}

{% block content %}
<div class="container mt-4">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="mb-1">Create New Task</h2>
      <p class="text-muted mb-0">Assign a task to a department user and track progress.</p>
    </div>

    <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">
      Back to Dashboard
    </a>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-body p-4">

      <form method="post" class="row g-4">

        <div class="col-md-6">
          <label class="form-label fw-semibold">Task Title</label>
          <input 
            type="text" 
            name="title" 
            class="form-control" 
            placeholder="Enter task title"
            required
          >
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">Due Date</label>
          <input 
            type="date" 
            name="due_date" 
            class="form-control"
          >
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">Department</label>
          <select name="department_id" class="form-select" required>
            <option value="">Select department</option>
            {% for d in departments %}
              <option value="{{ d.id }}">{{ d.name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label fw-semibold">Assign To</label>
          <select name="assignee_id" class="form-select" required>
            <option value="">Select assignee</option>
            {% for u in users %}
              <option value="{{ u.id }}">
                {{ u.name }}{% if u.department %} — {{ u.department.name }}{% endif %}
              </option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-12">
          <label class="form-label fw-semibold">Description</label>
          <textarea 
            name="description" 
            class="form-control" 
            rows="5"
            placeholder="Add clear task details, requirements, or expected outcome"
          ></textarea>
        </div>

        <div class="col-12 d-flex justify-content-end gap-2">
          <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">
            Cancel
          </a>

          <button type="submit" class="btn btn-primary fw-semibold">
            Create Task
          </button>
        </div>

      </form>

    </div>
  </div>

</div>
{% endblock %}
